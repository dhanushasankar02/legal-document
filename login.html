<!DOCTYPE html>
<html lang="en" class="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JurisDraft Legal Platform</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="alternate icon" href="favicon.svg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: {
              800: '#102a43',
              900: '#061727',
              950: '#030c17',
            }
          }
        }
      }
    }
  </script>

  <!-- EMBEDDED CSS STYLES WITH MOBILE RESET -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

    *, ::before, ::after {
      box-sizing: border-box;
    }

    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    img, svg, video, canvas, iframe {
      max-width: 100%;
      height: auto;
    }

    p, h1, h2, h3, h4, h5, h6, span, a, label, button, input, textarea, select {
      overflow-wrap: break-word;
      word-break: break-word;
    }

    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3, .font-serif {
      font-family: 'Playfair Display', Georgia, serif;
    }

    /* Hero Background & Gradient Theme matching index.html */
    .hero-login-bg {
      background-image: linear-gradient(135deg, rgba(6, 23, 39, 0.94), rgba(15, 23, 42, 0.97)), 
                        url('images/login_hero.jpg');
      background-size: cover;
      background-position: center;
    }

    .light .hero-login-bg {
      background-image: radial-gradient(at 0% 0%, rgba(219, 234, 254, 0.8) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(254, 243, 199, 0.8) 0px, transparent 50%),
                        linear-gradient(to bottom, #f8fafc, #f1f5f9);
    }

    /* Glassmorphism Card matching index.html aesthetics */
    .login-card {
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }

    .dark .login-card {
      background-color: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(30, 41, 59, 0.8);
    }

    /* RTL Support */
    [dir="rtl"] {
      text-align: right;
    }
  </style>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('legal_doc_theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      const savedDir = localStorage.getItem('legal_doc_dir') || 'ltr';
      document.documentElement.setAttribute('dir', savedDir);
    })();
  </script>
</head>
<body class="hero-login-bg text-slate-900 dark:text-slate-100 min-h-screen overflow-y-auto flex flex-col justify-between select-none antialiased">

  <!-- ========================================================= -->
  <!-- TOP MINIMAL HEADER BAR (WITH UTILITY ICON BUTTONS) -->
  <!-- ========================================================= -->
  <div class="w-full px-6 py-3 flex items-center justify-end z-20">

    <!-- Utility Icon Buttons (Matching index.html) -->
    <div class="flex items-center gap-2.5">
      <!-- 🌙 Dark Mode Toggle -->
      <button id="theme-toggle" title="Toggle Dark Mode" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/80 dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition border border-slate-200 dark:border-slate-700 shadow-sm text-xs font-semibold cursor-pointer whitespace-nowrap">
        <span id="theme-toggle-icon" class="flex items-center">
          <svg class="w-4 h-4 text-slate-700 dark:text-slate-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </span>
        <span id="theme-toggle-text">Dark Mode</span>
      </button>

      <!-- ↔️ RTL / LTR Toggle -->
      <button id="rtl-toggle" title="Toggle RTL / LTR" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/80 dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition border border-slate-200 dark:border-slate-700 shadow-sm text-xs font-semibold cursor-pointer whitespace-nowrap">
        <svg class="w-4 h-4 text-slate-700 dark:text-slate-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 3 4 7l4 4"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="m16 21 4-4-4-4"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 17H4"/>
        </svg>
        <span id="rtl-toggle-text">RTL / LTR</span>
      </button>

    </div>
  </div>

  <!-- ========================================================= -->
  <!-- MAIN STICKY CENTERED LOGIN CARD -->
  <!-- ========================================================= -->
  <main class="w-full flex-grow flex items-center justify-center px-4 py-2 z-10 overflow-hidden">
    <div class="w-full max-w-md login-card rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden transition-all duration-300">
      
      <!-- Top Accent Stripe matching index.html buttons -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-900 via-amber-500 to-blue-600"></div>

      <!-- Card Title & Clickable Logo Header (Navigates to index.html) -->
      <div class="flex flex-col items-center justify-center mb-6">
        <a href="index.html" title="Go to JurisDraft Home Page" class="flex items-center justify-center gap-3 mb-2 group transition-transform duration-200 hover:scale-[1.03] cursor-pointer">
          <div class="w-11 h-11 rounded-xl bg-blue-900 dark:bg-blue-600 text-amber-400 flex items-center justify-center font-bold shadow-md flex-shrink-0 group-hover:shadow-amber-500/20 transition-all">
            <svg class="w-6 h-6 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18"/>
            </svg>
          </div>
          <div class="flex flex-col text-start">
            <span class="font-serif text-2xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight group-hover:text-amber-500 transition-colors">
              JurisDraft
            </span>
            <span class="text-[11px] uppercase tracking-widest text-slate-500 dark:text-slate-400 font-bold -mt-0.5">
              LEGAL PLATFORM
            </span>
          </div>
        </a>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium text-center">
          Sign in to access your legal documents and vaults
        </p>
      </div>

      <!-- SINGLE UNIFIED LOGIN FORM -->
      <form id="single-login-form" class="space-y-4" onsubmit="handleLoginSubmit(event)">
        
        <!-- Email Address / Username -->
        <div>
          <label for="login-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
              </svg>
            </div>
            <input 
              type="text" 
              id="login-email" 
              required
              placeholder="name@jurisdraft.com" 
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
            />
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
              Password
            </label>
            <a href="#" onclick="showToast('Password reset link sent to your email ✉️'); return false;" class="text-xs text-amber-600 dark:text-amber-400 hover:underline font-medium transition">
              Forgot Password?
            </a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input 
              type="password" 
              id="login-password" 
              required
              placeholder="••••••••••••" 
              class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
            />
            <!-- Show/Hide Password Toggle -->
            <button 
              type="button" 
              onclick="togglePasswordVisibility()" 
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition"
              title="Toggle password visibility"
            >
              <svg id="eye-icon-show" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg id="eye-icon-hide" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 013.682-.963c4.478 0 8.268 2.943 9.542 7a9.97 9.97 0 01-2.008 3.593M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded border-slate-300 dark:border-slate-700 text-blue-900 focus:ring-blue-800 dark:bg-slate-800">
            <span class="text-xs text-slate-600 dark:text-slate-300 font-medium">Remember me for 30 days</span>
          </label>
        </div>

        <!-- Primary Sign In Submit Button matching index.html buttons -->
        <button 
          type="submit" 
          id="login-submit-btn" 
          class="w-full py-3 px-4 bg-blue-900 hover:bg-blue-800 dark:bg-blue-600 dark:hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer"
        >
          <span>Sign In</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>

        <!-- Or Sign In With (3 Icons) -->
        <div class="pt-3 text-center">
          <div class="flex items-center justify-center my-3 gap-2">
            <div class="grow border-t border-slate-200 dark:border-slate-800"></div>
            <span class="shrink-0 px-2 text-[10px] font-semibold uppercase tracking-wider text-slate-400 whitespace-nowrap">or sign in with</span>
            <div class="grow border-t border-slate-200 dark:border-slate-800"></div>
          </div>
          
          <!-- 3 Social / SSO Icon Buttons -->
          <div class="flex items-center justify-center gap-3 mb-4">
            <!-- 1. Google Icon -->
            <button 
              type="button" 
              onclick="showToast('Signing in with Google Account... 🌐')" 
              title="Sign in with Google" 
              class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 flex items-center justify-center border border-slate-200 dark:border-slate-700 transition transform hover:scale-105 shadow-sm"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
            </button>

            <!-- 2. Apple Icon -->
            <button 
              type="button" 
              onclick="showToast('Signing in with Apple ID... 🍏')" 
              title="Sign in with Apple" 
              class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-900 dark:text-white flex items-center justify-center border border-slate-200 dark:border-slate-700 transition transform hover:scale-105 shadow-sm"
            >
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.95.99-3.09-.97.04-2.14.65-2.83 1.46-.62.72-1.16 1.88-1.01 3 1.08.08 2.18-.55 2.85-1.37z"/>
              </svg>
            </button>

            <!-- 3. Microsoft / SSO Icon -->
            <button 
              type="button" 
              onclick="showToast('Signing in with Enterprise SSO... 🔐')" 
              title="Sign in with Enterprise SSO" 
              class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 flex items-center justify-center border border-slate-200 dark:border-slate-700 transition transform hover:scale-105 shadow-sm"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#F25022" d="M1 1h10v10H1z"/>
                <path fill="#7FBA00" d="M13 1h10v10H13z"/>
                <path fill="#00A4EF" d="M1 13h10v10H1z"/>
                <path fill="#FFB900" d="M13 13h10v10H13z"/>
              </svg>
            </button>
          </div>
        </div>



        <!-- Register Link -->
        <div class="pt-2 border-t border-slate-200 dark:border-slate-800 text-center">
          <p class="text-xs text-slate-600 dark:text-slate-400">
            Don't have an account? 
            <a href="register.html" class="text-amber-600 dark:text-amber-400 font-bold hover:underline">
              Create Account
            </a>
          </p>
        </div>

      </form>
    </div>
  </main>

  <!-- NO FOOTER SECTION (Clean copyright line) -->
  <div class="w-full py-3 px-6 text-center text-slate-500 dark:text-slate-400 text-xs z-20">
    <span>© 2026 JurisDraft Platform. All rights reserved.</span>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-notification" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none font-medium text-xs sm:text-sm">
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Theme & Direction Initialization matching index.html
    function initThemeAndDirection() {
      const darkToggle = document.getElementById('theme-toggle');
      const darkText = document.getElementById('theme-toggle-text');
      const savedTheme = localStorage.getItem('legal_doc_theme');

      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        if (darkText) darkText.textContent = 'Light Mode';
      } else {
        document.documentElement.classList.remove('dark');
        if (darkText) darkText.textContent = 'Dark Mode';
      }

      function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('legal_doc_theme', isDark ? 'dark' : 'light');
        if (darkText) darkText.textContent = isDark ? 'Light Mode' : 'Dark Mode';
        showToast(isDark ? 'Dark Mode Enabled 🌙' : 'Light Mode Enabled ☀️');
      }

      if (darkToggle) darkToggle.addEventListener('click', toggleTheme);

      const rtlToggle = document.getElementById('rtl-toggle');
      const rtlText = document.getElementById('rtl-toggle-text');
      const savedDir = localStorage.getItem('legal_doc_dir') || 'ltr';

      document.documentElement.setAttribute('dir', savedDir);
      if (rtlText) rtlText.textContent = savedDir === 'rtl' ? 'LTR View' : 'RTL View';

      function toggleDirection() {
        const currentDir = document.documentElement.getAttribute('dir');
        const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
        document.documentElement.setAttribute('dir', newDir);
        localStorage.setItem('legal_doc_dir', newDir);
        if (rtlText) rtlText.textContent = newDir === 'rtl' ? 'LTR View' : 'RTL View';
        showToast(`Layout switched to ${newDir.toUpperCase()} mode ↔️`);
      }

      if (rtlToggle) rtlToggle.addEventListener('click', toggleDirection);
    }

    document.addEventListener('DOMContentLoaded', initThemeAndDirection);

    // Toggle Password Visibility
    function togglePasswordVisibility() {
      const passInput = document.getElementById('login-password');
      const eyeShow = document.getElementById('eye-icon-show');
      const eyeHide = document.getElementById('eye-icon-hide');

      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeShow.classList.add('hidden');
        eyeHide.classList.remove('hidden');
      } else {
        passInput.type = 'password';
        eyeShow.classList.remove('hidden');
        eyeHide.classList.add('hidden');
      }
    }

    // Demo Fill Helpers
    let targetRedirect = 'user-dashboard.html';

    function fillDemoUser() {
      document.getElementById('login-email').value = 'john.doe@jurisdraft.com';
      document.getElementById('login-password').value = 'userPassword123!';
      targetRedirect = 'user-dashboard.html';
      showToast('Client credentials autofilled 👤');
    }

    function fillDemoAdmin() {
      document.getElementById('login-email').value = 'admin.governance@jurisdraft.com';
      document.getElementById('login-password').value = 'adminSecret2026!';
      targetRedirect = 'admin-dashboard.html';
      showToast('Admin credentials autofilled 🛡️');
    }

    // Login Form Submit Handler
    function handleLoginSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('login-submit-btn');
      
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Authenticating...</span>
      `;

      showToast('Login successful! Redirecting...');

      setTimeout(() => {
        window.location.href = targetRedirect;
      }, 1200);
    }

    // Toast function
    function showToast(msg) {
      const toast = document.getElementById('toast-notification');
      if (toast) {
        toast.textContent = msg;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0', 'pointer-events-none');
        }, 3000);
      }
    }
  </script>
</body>
</html>
