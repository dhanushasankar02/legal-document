<!DOCTYPE html>
<html lang="en" class="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - JurisDraft Legal Platform</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="alternate icon" href="favicon.svg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: {
              800: '#102a43',
              900: '#061727',
              950: '#030c17',
            }
          }
        }
      }
    }
  </script>

  <!-- EMBEDDED CSS STYLES WITH MOBILE RESET -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

    *, ::before, ::after {
      box-sizing: border-box;
    }

    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    img, svg, video, canvas, iframe {
      max-width: 100%;
      height: auto;
    }

    p, h1, h2, h3, h4, h5, h6, span, a, label, button, input, textarea, select {
      overflow-wrap: break-word;
      word-break: break-word;
    }

    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3, .font-serif {
      font-family: 'Playfair Display', Georgia, serif;
    }

    /* Hero Background & Gradient Theme matching index.html */
    .hero-register-bg {
      background-image: linear-gradient(135deg, rgba(6, 23, 39, 0.94), rgba(15, 23, 42, 0.97)), 
                        url('images/register_hero.jpg');
      background-size: cover;
      background-position: center;
    }

    .light .hero-register-bg {
      background-image: radial-gradient(at 0% 0%, rgba(219, 234, 254, 0.8) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(254, 243, 199, 0.8) 0px, transparent 50%),
                        linear-gradient(to bottom, #f8fafc, #f1f5f9);
    }

    /* Glassmorphism Card matching index.html aesthetics */
    .register-card {
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }

    .dark .register-card {
      background-color: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(30, 41, 59, 0.8);
    }

    /* RTL Support */
    [dir="rtl"] {
      text-align: right;
    }
  </style>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('legal_doc_theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      const savedDir = localStorage.getItem('legal_doc_dir') || 'ltr';
      document.documentElement.setAttribute('dir', savedDir);
    })();
  </script>
</head>
<body class="hero-register-bg text-slate-900 dark:text-slate-100 min-h-screen overflow-y-auto flex flex-col justify-between select-none antialiased">

  <!-- ========================================================= -->
  <!-- TOP MINIMAL HEADER BAR (NO NAVBAR)                         -->
  <!-- ========================================================= -->
  <div class="w-full px-6 py-2 flex items-center justify-end z-20">

    <!-- Utility Controls (Matching index.html) -->
    <div class="flex items-center gap-2.5">
      <!-- 🌙 Dark Mode Toggle -->
      <button id="theme-toggle" title="Toggle Dark Mode" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/80 dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition border border-slate-200 dark:border-slate-700 shadow-sm text-xs font-semibold cursor-pointer whitespace-nowrap">
        <span id="theme-toggle-icon" class="flex items-center">
          <svg class="w-4 h-4 text-slate-700 dark:text-slate-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </span>
        <span id="theme-toggle-text">Dark Mode</span>
      </button>

      <!-- ↔️ RTL / LTR Toggle -->
      <button id="rtl-toggle" title="Toggle RTL / LTR" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/80 dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition border border-slate-200 dark:border-slate-700 shadow-sm text-xs font-semibold cursor-pointer whitespace-nowrap">
        <svg class="w-4 h-4 text-slate-700 dark:text-slate-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 3 4 7l4 4"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="m16 21 4-4-4-4"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 17H4"/>
        </svg>
        <span id="rtl-toggle-text">RTL / LTR</span>
      </button>
    </div>
  </div>

  <!-- ========================================================= -->
  <!-- MAIN STICKY CENTERED REGISTER CARD -->
  <!-- ========================================================= -->
  <main class="w-full flex-grow flex items-center justify-center px-4 py-2 z-10 overflow-hidden">
    <div class="w-full max-w-md register-card rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden transition-all duration-300">
      
      <!-- Top Accent Stripe -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-900 via-amber-500 to-blue-600"></div>

      <!-- Clickable Brand Logo Header (Links to index.html) -->
      <div class="flex flex-col items-center justify-center mb-5">
        <a href="index.html" title="Go to JurisDraft Home Page" class="flex items-center justify-center gap-3 mb-1.5 group transition-transform duration-200 hover:scale-[1.03] cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-blue-900 dark:bg-blue-600 text-amber-400 flex items-center justify-center font-bold shadow-md flex-shrink-0 group-hover:shadow-amber-500/20 transition-all">
            <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18"/>
            </svg>
          </div>
          <div class="flex flex-col text-start">
            <span class="font-serif text-2xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight group-hover:text-amber-500 transition-colors">
              JurisDraft
            </span>
            <span class="text-[10px] uppercase tracking-widest text-slate-500 dark:text-slate-400 font-bold -mt-0.5">
              LEGAL PLATFORM
            </span>
          </div>
        </a>
        <h1 class="font-serif text-xl font-bold text-slate-900 dark:text-white tracking-tight mt-1">
          Create Your Account
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 font-medium text-center">
          Start drafting legally valid documents in minutes
        </p>
      </div>

      <!-- REGISTRATION FORM -->
      <form id="register-form" class="space-y-3.5" onsubmit="handleRegisterSubmit(event)">
        
        <!-- Full Name -->
        <div>
          <label for="reg-name" class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">
            Full Name
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
            <input 
              type="text" 
              id="reg-name" 
              required
              placeholder="Attorney Sarah Jenkins" 
              class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-xs focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
            />
          </div>
        </div>

        <!-- Email Address -->
        <div>
          <label for="reg-email" class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
              </svg>
            </div>
            <input 
              type="email" 
              id="reg-email" 
              required
              placeholder="sarah@jurisdraft.com" 
              class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-xs focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
            />
          </div>
        </div>

        <!-- Password Grid (Password & Confirm Password) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="reg-password" class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">
              Password
            </label>
            <div class="relative">
              <input 
                type="password" 
                id="reg-password" 
                required
                placeholder="••••••••" 
                class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-xs focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
              />
            </div>
          </div>

          <div>
            <label for="reg-confirm-password" class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">
              Confirm Password
            </label>
            <div class="relative">
              <input 
                type="password" 
                id="reg-confirm-password" 
                required
                placeholder="••••••••" 
                class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-xs focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
              />
            </div>
          </div>
        </div>

        <!-- Terms Agreement Checkbox -->
        <div class="flex items-center gap-2 pt-0.5">
          <input type="checkbox" id="terms-agree" required class="w-3.5 h-3.5 rounded border-slate-300 dark:border-slate-700 text-blue-900 focus:ring-blue-800 dark:bg-slate-800">
          <label for="terms-agree" class="text-[11px] text-slate-600 dark:text-slate-400 cursor-pointer">
            I agree to the <a href="#" onclick="showToast('Legal Terms opened'); return false;" class="text-amber-600 dark:text-amber-400 font-medium hover:underline">Terms of Service</a> & <a href="#" onclick="showToast('Privacy Policy opened'); return false;" class="text-amber-600 dark:text-amber-400 font-medium hover:underline">Privacy Policy</a>
          </label>
        </div>

        <!-- Primary Create Account Submit Button -->
        <button 
          type="submit" 
          id="register-submit-btn" 
          class="w-full py-2.5 px-4 bg-blue-900 hover:bg-blue-800 dark:bg-blue-600 dark:hover:bg-blue-500 text-white font-bold rounded-xl text-xs sm:text-sm transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer mt-1"
        >
          <span>Create Account</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>

        <!-- Social Sign-Up Options (3 Icons) -->
        <div class="pt-2 text-center">
          <div class="flex items-center justify-center my-3 gap-2">
            <div class="grow border-t border-slate-200 dark:border-slate-800"></div>
            <span class="shrink-0 px-2 text-[10px] font-semibold uppercase tracking-wider text-slate-400 whitespace-nowrap">or sign up with</span>
            <div class="grow border-t border-slate-200 dark:border-slate-800"></div>
          </div>
          
          <!-- 3 Social / SSO Icon Buttons -->
          <div class="flex items-center justify-center gap-3 mb-2">
            <!-- 1. Google Icon -->
            <button 
              type="button" 
              onclick="showToast('Connecting Google Account... 🌐')" 
              title="Sign up with Google" 
              class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 flex items-center justify-center border border-slate-200 dark:border-slate-700 transition transform hover:scale-105 shadow-sm"
            >
              <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
            </button>

            <!-- 2. Apple Icon -->
            <button 
              type="button" 
              onclick="showToast('Connecting Apple ID... 🍏')" 
              title="Sign up with Apple" 
              class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-900 dark:text-white flex items-center justify-center border border-slate-200 dark:border-slate-700 transition transform hover:scale-105 shadow-sm"
            >
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.95.99-3.09-.97.04-2.14.65-2.83 1.46-.62.72-1.16 1.88-1.01 3 1.08.08 2.18-.55 2.85-1.37z"/>
              </svg>
            </button>

            <!-- 3. Microsoft / Enterprise SSO Icon -->
            <button 
              type="button" 
              onclick="showToast('Connecting Enterprise SSO... 🔐')" 
              title="Sign up with Enterprise SSO" 
              class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 flex items-center justify-center border border-slate-200 dark:border-slate-700 transition transform hover:scale-105 shadow-sm"
            >
              <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#F25022" d="M1 1h10v10H1z"/>
                <path fill="#7FBA00" d="M13 1h10v10H13z"/>
                <path fill="#00A4EF" d="M1 13h10v10H1z"/>
                <path fill="#FFB900" d="M13 13h10v10H13z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Already Have an Account Link to login.html -->
        <div class="pt-2 border-t border-slate-200 dark:border-slate-800 text-center">
          <p class="text-xs text-slate-600 dark:text-slate-400">
            Already have an account? 
            <a href="login.html" class="text-amber-600 dark:text-amber-400 font-bold hover:underline">
              Sign In
            </a>
          </p>
        </div>

      </form>
    </div>
  </main>

  <!-- NO FOOTER SECTION (Clean copyright line) -->
  <div class="w-full py-2 px-6 text-center text-slate-500 dark:text-slate-400 text-xs z-20">
    <span>© 2026 JurisDraft Platform. All rights reserved.</span>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-notification" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none font-medium text-xs sm:text-sm">
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Theme & Direction Initialization matching index.html
    function initThemeAndDirection() {
      const darkToggle = document.getElementById('theme-toggle');
      const darkText = document.getElementById('theme-toggle-text');
      const savedTheme = localStorage.getItem('legal_doc_theme');

      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        if (darkText) darkText.textContent = 'Light Mode';
      } else {
        document.documentElement.classList.remove('dark');
        if (darkText) darkText.textContent = 'Dark Mode';
      }

      function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('legal_doc_theme', isDark ? 'dark' : 'light');
        if (darkText) darkText.textContent = isDark ? 'Light Mode' : 'Dark Mode';
        showToast(isDark ? 'Dark Mode Enabled 🌙' : 'Light Mode Enabled ☀️');
      }

      if (darkToggle) darkToggle.addEventListener('click', toggleTheme);

      const rtlToggle = document.getElementById('rtl-toggle');
      const rtlText = document.getElementById('rtl-toggle-text');
      const savedDir = localStorage.getItem('legal_doc_dir') || 'ltr';

      document.documentElement.setAttribute('dir', savedDir);
      if (rtlText) rtlText.textContent = savedDir === 'rtl' ? 'LTR View' : 'RTL View';

      function toggleDirection() {
        const currentDir = document.documentElement.getAttribute('dir');
        const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
        document.documentElement.setAttribute('dir', newDir);
        localStorage.setItem('legal_doc_dir', newDir);
        if (rtlText) rtlText.textContent = newDir === 'rtl' ? 'LTR View' : 'RTL View';
        showToast(`Layout switched to ${newDir.toUpperCase()} mode ↔️`);
      }

      if (rtlToggle) rtlToggle.addEventListener('click', toggleDirection);
    }

    document.addEventListener('DOMContentLoaded', initThemeAndDirection);

    // Form submission handler
    function handleRegisterSubmit(e) {
      e.preventDefault();
      const pass = document.getElementById('reg-password').value;
      const confirmPass = document.getElementById('reg-confirm-password').value;

      if (pass !== confirmPass) {
        showToast('⚠️ Passwords do not match! Please check again.');
        return;
      }

      const btn = document.getElementById('register-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Creating Account...</span>
      `;

      showToast('Account created successfully! Redirecting to vault...');

      setTimeout(() => {
        window.location.href = 'user-dashboard.html';
      }, 1300);
    }

    // Toast function
    function showToast(msg) {
      const toast = document.getElementById('toast-notification');
      if (toast) {
        toast.textContent = msg;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0', 'pointer-events-none');
        }, 3000);
      }
    }
  </script>
</body>
</html>
